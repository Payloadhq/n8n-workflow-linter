name: 'n8n Workflow Linter'
description: 'Static production-readiness checks for exported n8n workflow JSON: missing error handling, HTTP nodes without timeouts or retries, hardcoded secrets, trigger problems, dead nodes.'
author: 'Payload'
branding:
  icon: 'check-circle'
  color: 'blue'
inputs:
  paths:
    description: 'Space-separated glob patterns matching exported n8n workflow JSON files.'
    required: false
    default: 'workflows/**/*.json'
  fail-on-error:
    description: 'Fail the job when any workflow has lint errors. Warnings never fail the job.'
    required: false
    default: 'true'
runs:
  using: 'composite'
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install n8n-workflow-linter
      shell: bash
      run: python -m pip install --quiet "${{ github.action_path }}"
    - name: Lint workflows
      shell: bash
      env:
        INPUT_PATHS: ${{ inputs.paths }}
        FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
      run: |
        shopt -s globstar nullglob
        status=0
        found=0
        for pattern in $INPUT_PATHS; do
          for f in $pattern; do
            found=1
            echo "::group::Lint $f"
            n8n-workflow-linter "$f"
            rc=$?
            echo "::endgroup::"
            if [ "$rc" -eq 1 ]; then status=1; fi
          done
        done
        if [ "$found" -eq 0 ]; then echo "No workflow files matched: $INPUT_PATHS"; fi
        if [ "$FAIL_ON_ERROR" = "true" ]; then exit $status; fi
        exit 0
